name: Offline quality
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[service]"
      - run: python tests/run_quality_checks.py
      - run: node --check src/multires_app/preview/scene_viewer.js
      - run: node --check src/multires_app/preview/layout_refinement_ui.js
      - run: node --check src/multires_app/preview/anchor_layout_ui.js
      - run: python tests/check_preview_javascript.py node src/multires_app/service/saas_dashboard.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-quality-results
          path: artifacts/reports/quality-results.json
