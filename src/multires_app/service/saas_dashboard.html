<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主题适配工作台</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#18384a;background:#edf3f5}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;background:#18384a;color:white;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 18px}small,.muted{color:#637c88;font-size:13px;line-height:1.7}header small{color:#bcd7df}.badge{font-size:12px;background:#2b5263;padding:6px 12px;border-radius:20px}main{max-width:1360px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:white;border:1px solid #dbe5e9;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px #12334408}label{display:block;font-size:13px;margin:14px 0 6px}input,select,button{font:inherit;border:1px solid #ccdce3;border-radius:8px;padding:10px 12px}input,select{width:100%;background:#f8fbfc;color:#18384a}input[type=file]{font-size:12px}.row{display:flex;gap:12px}.row>div{flex:1}button{background:#097e83;color:white;cursor:pointer}button:hover{background:#09686c}button:disabled{opacity:.45;cursor:default}.secondary{background:#f4f9fa;color:#21606b}.secondary:hover{background:#e3f1f2}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.job{padding:16px;border:1px solid #dbe5e9;border-radius:10px;margin-top:12px;cursor:pointer}.job:hover,.job.selected{border-color:#087e83;background:#f2faf9}.job strong{font-size:14px}.job small{display:block;margin-top:6px}#jobs{max-height:550px;overflow:auto}#notice{font-size:13px;line-height:1.7;white-space:pre-wrap}#proposal{font:12px/1.65 ui-monospace,monospace;background:#f5f9fb;padding:16px;border-radius:8px;max-height:350px;overflow:auto;white-space:pre-wrap}a{color:#087e83}#details{min-height:180px}.empty{padding:36px;text-align:center;color:#637c88}@media(max-width:850px){main{grid-template-columns:1fr}header{align-items:flex-start}.row{flex-wrap:wrap}}
</style>
<header><div><h1>主题适配工作台</h1><small>保留原有构图，让主题适应新的画布。</small></div><span class="badge">内测版 · 输出需设备验收</span></header>
<main><aside><section class="card"><h2>客户访问</h2><label for="key">访问密钥</label><input id="key" type="password" autocomplete="off" placeholder="由管理员提供"><div class="actions"><button id="connect">连接工作区</button><button id="logout" class="secondary">退出</button></div><p class="muted">密钥仅用于当前页面会话，不保存到浏览器。</p></section>
<section class="card"><h2>新建适配</h2><label for="theme">主题文件</label><input id="theme" type="file" accept=".hwt,.zip"><div class="row"><div><label for="width">目标宽度</label><input id="width" type="number" min="240" max="8192" value="2560"></div><div><label for="height">目标高度</label><input id="height" type="number" min="240" max="8192" value="1600"></div></div><label for="mode">布局策略</label><select id="mode"><option value="auto">自动：相近比例复用，大变化两列</option><option value="preserve">保留原布局</option><option value="reflow">原顺序两列</option></select><div class="actions"><button id="upload">开始适配</button></div><p class="muted">支持 100MB 以内的主题包。横屏时优先利用左侧或顶部留白放置时间、日期。</p></section>
<section class="card" aria-live="polite"><h2>进度</h2><div id="notice">请连接工作区。</div></section></aside>
<section><div class="card"><div class="row"><h2>适配任务</h2><button id="refresh" class="secondary">刷新</button></div><div id="jobs" class="empty">尚未加载任务</div></div>
<div class="card"><h2>结果与版本</h2><div id="details" class="empty">选择一个已完成的任务，预览结果或调整布局。</div><div class="actions"><button id="preview" disabled>打开对比预览</button><button id="download" class="secondary" disabled>下载主题包</button><button id="readiness" class="secondary" disabled>下载验收报告</button><button id="rollback" class="secondary" disabled>恢复初始版本</button></div></div>
<div class="card"><h2>审查与微调布局</h2><p class="muted">可将布局请求交给自己的大模型，导回建议；也可选择预期渲染图进行本地匹配。建议先展示，确认后才创建新版本。</p><div class="actions"><button id="export" disabled>导出布局请求</button></div><label for="import">导入布局建议 JSON</label><input id="import" type="file" accept=".json,application/json"><label for="reference">预期渲染图</label><input id="reference" type="file" accept="image/png,image/jpeg,image/webp"><div class="actions"><button id="match" class="secondary" disabled>生成 bbox 匹配建议</button><button id="apply" disabled>应用建议，创建新版本</button><button id="saveProposal" class="secondary" disabled>下载建议 JSON</button></div><pre id="proposal">尚无待审查建议。</pre></div></section></main>
<script>
const $=id=>document.getElementById(id);let accessKey='',selected=null,pending=null,timer=null,busy=false,sessionEpoch=0;
const statuses={uploading:'正在上传',queued:'等待处理',running:'正在适配',editing:'生成新版本',matching:'匹配参考图',succeeded:'已完成',failed:'处理失败'};
function notice(text){$('notice').textContent=text;}
function ensureSession(epoch){if(epoch!==sessionEpoch)throw Error('页面会话已变更');}
async function api(path,options={}){if(!accessKey)throw Error('请先连接工作区');const epoch=sessionEpoch;const response=await fetch(path,{...options,headers:{Authorization:'Bearer '+accessKey,...options.headers}});const result=await response.json();ensureSession(epoch);if(!response.ok)throw Error(result.error||'请求失败');return result;}
function downloadJSON(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function controls(){const available=selected?.status==='succeeded';for(const id of ['preview','download','readiness','export','match'])$(id).disabled=!available||busy;$('rollback').disabled=!available||!selected.active_revision||busy;$('apply').disabled=!available||!pending||busy;$('saveProposal').disabled=!pending;}
async function refresh(){const result=await api('/v1/jobs');$('jobs').replaceChildren();$('jobs').className='';for(const job of result.jobs){const item=document.createElement('div');item.className='job'+(selected?.id===job.id?' selected':'');const title=document.createElement('strong');title.textContent=`${job.config.width} × ${job.config.height} · ${statuses[job.status]||job.status}`;const detail=document.createElement('small');detail.textContent=`${job.id.slice(0,8)} · 版本 ${job.active_revision} · ${new Date(job.created*1000).toLocaleString()}`;item.append(title,detail);item.onclick=()=>{if(busy)return;selected=job;pending=null;$('proposal').textContent='尚无待审查建议。';showSelected();action(refresh);};$('jobs').append(item);if(selected?.id===job.id)selected=job;}if(!result.jobs.length)$('jobs').textContent='暂无适配任务。';showSelected();}
function showSelected(){if(!selected){controls();return;}const result=selected.result||{};$('details').className='';$('details').textContent=`任务 ${selected.id.slice(0,8)} · ${statuses[selected.status]||selected.status}\n当前版本：${selected.active_revision}\n${result.reviewCount!==undefined?'待复核项：'+result.reviewCount+'\n':''}${result.explorationBounded?'交互覆盖：有界探索，仍需复核未展开分支\n':''}${selected.error||'输出为锁屏适配候选，请在目标平板验收。'}`;$('details').style.whiteSpace='pre-wrap';controls();}
async function poll(task){for(let i=0;i<120;i++){const result=await api('/v1/tasks/'+task);if(result.status==='failed')throw Error(result.error||'任务失败');if(result.status==='succeeded')return result.result;await new Promise(resolve=>setTimeout(resolve,2000));}throw Error('任务仍在处理，可稍后刷新查看。');}
async function action(callback){if(busy)return;const epoch=sessionEpoch;busy=true;controls();try{await callback();}catch(e){if(epoch===sessionEpoch)notice(e.message);}finally{if(epoch===sessionEpoch){busy=false;controls();}}}
function clearSession(){sessionEpoch++;accessKey='';selected=null;pending=null;busy=false;if(timer)clearInterval(timer);timer=null;$('jobs').textContent='尚未加载任务';$('details').textContent='请选择任务';$('proposal').textContent='尚无待审查建议。';controls();}
$('connect').onclick=()=>{if(busy)return;const key=$('key').value.trim();clearSession();action(async()=>{accessKey=key;await refresh();notice('工作区已连接。');timer=setInterval(()=>{if(!busy&&!document.hidden)action(refresh);},5000);});};
$('logout').onclick=()=>{clearSession();$('key').value='';$('jobs').textContent='已退出工作区';notice('已清除当前页面的密钥。');};
$('refresh').onclick=()=>action(refresh);
$('upload').onclick=()=>action(async()=>{const file=$('theme').files[0];if(!file)throw Error('请选择主题文件');if(file.size>100*1024*1024)throw Error('主题不能超过 100MB');notice('正在上传主题…');const query=new URLSearchParams({width:$('width').value,height:$('height').value,mode:$('mode').value});const result=await api('/v1/jobs?'+query,{method:'POST',headers:{'Content-Type':'application/octet-stream','Idempotency-Key':crypto.randomUUID()},body:file});notice('已进入队列，任务 '+result.job.slice(0,8));await refresh();});
$('preview').onclick=()=>action(async()=>{const result=await api('/v1/jobs/'+selected.id+'/preview');const link=document.createElement('a');link.href=result.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='打开当前版本预览（10 分钟内有效）';$('notice').replaceChildren(link);});
$('download').onclick=()=>action(async()=>{const epoch=sessionEpoch,revision=selected.active_revision;const response=await fetch('/v1/jobs/'+selected.id+'/files/adapted.hwt',{headers:{Authorization:'Bearer '+accessKey}});if(!response.ok)throw Error('下载失败');const blob=await response.blob();ensureSession(epoch);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='adapted-v'+revision+'.hwt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('export').onclick=()=>action(async()=>{downloadJSON(await api('/v1/jobs/'+selected.id+'/layout-request'),'layout-refinement-request.json');notice('已导出请求，请导入大模型返回的建议 JSON。');});
$('readiness').onclick=()=>action(async()=>{downloadJSON(await api('/v1/jobs/'+selected.id+'/files/readiness.json'),'readiness-v'+selected.active_revision+'.json');notice('已导出验收报告，包含复核项和当前交付边界。');});
$('import').onchange=async e=>{const epoch=sessionEpoch,job=selected?.id;try{if(busy)throw Error('请等待当前操作完成');if(!selected||selected.status!=='succeeded')throw Error('请先选择已完成的任务');const file=e.target.files[0];if(!file)return;if(file.size>1024*1024)throw Error('JSON 不能超过 1MB');const document=JSON.parse(await file.text());ensureSession(epoch);if(job!==selected?.id)throw Error('任务已切换，请重新导入');if(document.kind!=='layout-refinement-proposal'||!Array.isArray(document.components))throw Error('建议 JSON 格式无效');pending=document;$('proposal').textContent=JSON.stringify(document,null,2);controls();notice('建议已加载；审查后可创建新版本。');}catch(error){if(epoch===sessionEpoch)notice(error.message);}finally{e.target.value='';}};
$('match').onclick=()=>action(async()=>{const file=$('reference').files[0];if(!file)throw Error('请选择预期渲染图');if(file.size>10*1024*1024)throw Error('参考图不能超过 10MB');notice('正在生成参考图匹配建议…');const task=await api('/v1/jobs/'+selected.id+'/reference-image',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});pending=await poll(task.task);$('proposal').textContent=JSON.stringify(pending,null,2);await refresh();notice('匹配建议已生成，低置信度项未修改。请审查建议。');});
$('apply').onclick=()=>action(async()=>{if(!pending)return;notice('正在校验并生成新版本…');const task=await api('/v1/jobs/'+selected.id+'/layout-proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)});await poll(task.task);pending=null;$('proposal').textContent='建议已应用，旧版本已保留。';await refresh();notice('新版本已生成，可预览或下载。');});
$('saveProposal').onclick=()=>{if(pending)downloadJSON(pending,'layout-refinement-proposal.json');};
$('rollback').onclick=()=>action(async()=>{await api('/v1/jobs/'+selected.id+'/revisions/0/activate',{method:'POST'});pending=null;await refresh();notice('已恢复初始版本，新版本仍保留。');});
controls();
</script></html>
